<script data-field-replace>
(function(){
  var params=new URLSearchParams(window.location.search);
  var fields={};
  var paramMap={
    'first_name':'firstName','last_name':'lastName','full_name':'fullName',
    'email':'email','phone':'phone','company':'company',
    'city':'city','state':'state','country':'country'
  };
  var skipTags={'SCRIPT':1,'STYLE':1,'NOSCRIPT':1,'TEXTAREA':1,'CODE':1,'PRE':1};
  var hasUrlFields=false;
  for(var p in paramMap){
    var v=params.get(p);
    if(v){fields[paramMap[p]]=v;hasUrlFields=true;}
  }
  var contactId=params.get('contact_id');
  function esc(s){
    if(!s)return s;
    var d=document.createElement('div');
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
  }
  function doReplace(data){
    var r={};
    r['{{full_name}}']=esc(((data.firstName||'')+' '+(data.lastName||'')).trim()||((data.fullName||data.name)||''));
    r['{{first_name}}']=esc(data.firstName||(data.name?data.name.split(' ')[0]:'')||'');
    r['{{last_name}}']=esc(data.lastName||(data.name&&data.name.indexOf(' ')>-1?data.name.substring(data.name.indexOf(' ')+1):'')||'');
    r['{{email}}']=esc(data.email||'');
    r['{{phone}}']=esc(data.phone||'');
    r['{{company}}']=esc(data.company||'');
    r['{{city}}']=esc(data.city||'');
    r['{{state}}']=esc(data.state||'');
    r['{{country}}']=esc(data.country||'');
    r['{{date}}']=new Date().toLocaleDateString();
    r['{{time}}']=new Date().toLocaleTimeString();
    r['{{location}}']=[data.city,data.state,data.country].filter(Boolean).join(', ');
    r['{{tracking_id}}']=esc(data.trackingId||'');
    r['{{lastClickedProduct}}']=esc(data.lastClickedProduct||'');
    r['{{lastProductClickDate}}']=esc(data.lastProductClickDate||'');
    r['{{lastClickedProductPrice}}']=esc(data.lastClickedProductPrice||'');
    r['{{lastClickedProductURL}}']=esc(data.lastClickedProductURL||'');
    r['{{productsClickedCount}}']=esc(data.productsClickedCount||'0');
    r['{{ip_address}}']=esc(data.ipAddress||'');
    r['{{ip}}']=esc(data.ipAddress||'');
    if(data.customFields){
      for(var k in data.customFields){
        r['{{'+k+'}}']=esc(String(data.customFields[k]||''));
      }
    }
    params.forEach(function(v,k){
      if(!paramMap[k]&&k!=='contact_id'&&k!=='page_id'&&k.indexOf('utm_')!==0){
        r['{{'+k+'}}']=esc(v);
      }
    });
    var hasValues=false;
    for(var key in r){if(r[key]){hasValues=true;break;}}
    if(!hasValues)return;
    var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{
      acceptNode:function(n){
        var p=n.parentNode;
        if(p&&skipTags[p.nodeName])return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var node;
    while(node=walker.nextNode()){
      var txt=node.nodeValue;
      if(txt&&txt.indexOf('{{')>-1){
        var changed=txt;
        for(var ph in r){
          if(r[ph]&&changed.indexOf(ph)>-1){
            changed=changed.split(ph).join(r[ph]);
          }
        }
        if(changed!==txt)node.nodeValue=changed;
      }
    }
    var attrs=['value','placeholder','content','alt','title'];
    attrs.forEach(function(attr){
      var els=document.querySelectorAll('['+attr+'*="{{"]');
      for(var i=0;i<els.length;i++){
        var tag=els[i].tagName;
        if(skipTags[tag])continue;
        var val=els[i].getAttribute(attr);
        if(val){
          var nv=val;
          for(var ph in r){
            if(r[ph]&&nv.indexOf(ph)>-1){
              nv=nv.split(ph).join(r[ph]);
            }
          }
          if(nv!==val)els[i].setAttribute(attr,nv);
        }
      }
    });
  }
  function run(){
    if(contactId){
      var xhr=new XMLHttpRequest();
      xhr.open('GET','https://my.chatbees.io/api/landing/context/'+encodeURIComponent(contactId)+'?page_id=7691');
      xhr.onload=function(){
        if(xhr.status===200){
          try{
            var resp=JSON.parse(xhr.responseText);
            if(resp.success&&resp.contact){
              var merged=resp.contact;
              for(var k in fields){merged[k]=fields[k];}
              doReplace(merged);
              return;
            }
          }catch(e){}
        }
        if(hasUrlFields)doReplace(fields);
      };
      xhr.onerror=function(){if(hasUrlFields)doReplace(fields);};
      xhr.send();
    }else if(hasUrlFields){
      doReplace(fields);
    }
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',run);}
  else{run();}
})();
</script>

/* ---- sign in with a passkey ---- */
var AO=null,AOt=0,DEAD=false,TRIED={},AUTO=0;
async function authOpts(){if(AO&&Date.now()-AOt<240000)return AO;AO=await call('auth-options');AOt=Date.now();return AO}
async function login(btn,msg,auto){
 msg.className='aerapk-msg';msg.textContent='';btn.disabled=true;
 try{var o=await authOpts();AO=null;var p=o.options;
  var a=await navigator.credentials.get({publicKey:{challenge:u2b(p.challenge),rpId:p.rpId,timeout:p.timeout,userVerification:p.userVerification,allowCredentials:[]}});
  var resp={id:a.id,rawId:b2u(a.rawId),type:a.type,clientExtensionResults:a.getClientExtensionResults?a.getClientExtensionResults():{},authenticatorAttachment:a.authenticatorAttachment||undefined,
   response:{clientDataJSON:b2u(a.response.clientDataJSON),authenticatorData:b2u(a.response.authenticatorData),signature:b2u(a.response.signature),userHandle:a.response.userHandle?b2u(a.response.userHandle):undefined}};
  var v=await call('auth-verify',{flowId:o.flowId,response:resp});
  msg.className='aerapk-msg ok';msg.textContent='Signing you in…';
  try{C.before&&C.before()}catch(e){}
  var r=await SB().auth.verifyOtp({token_hash:v.token_hash,type:'email'});if(r.error)throw r.error;
  var uid=r.data&&r.data.user&&r.data.user.id;if(uid)ls('aera.pk.u.'+uid,'1');ls('aera.pk.dev','1');
  try{C.after&&C.after()}catch(e){}
 }catch(e){try{C.fail&&C.fail()}catch(_){}
  var m=String(e&&e.message||e);
  msg.textContent=(e&&e.name==='NotAllowedError')?(auto?'':'Cancelled. Try again, or use your password.'):
   /unknown_passkey/.test(m)?LBL+' is not set up for this account yet. Sign in with your password once, then tap "Turn on '+LBL+'".':
   /expired/.test(m)?'That took too long. Try again.':'Could not sign in with '+LBL+'. Use your password.';
 }btn.disabled=false;authOpts().catch(function(){})}

/* ---- offer to turn it on after a normal sign-in ---- */
var RO=null,offering=false;
async function offer(){if(C.offer===false||offering||document.getElementById('aerapkCard'))return;var sb=SB();if(!sb)return;
 var s=sess();if(!s)return;var uid=s.user.id;
 if(TRIED[uid]||ls('aera.pk.u.'+uid)||+(ls('aera.pk.skip.'+uid)||0)>Date.now())return;TRIED[uid]=1;
 offering=true;try{
 if(!(await platform)&&!/iPhone|iPad|iPod|Android/.test(navigator.userAgent))return;
 try{RO=await call('reg-options',{},s.access_token)}catch(e){return}
 var d=document.createElement('div');d.id='aerapkCard';
 d.innerHTML='<div class="ic" style="color:#FDB913">'+FACE+'</div><div><b>Sign in with '+LBL+'</b><p>Skip the email and password next time. Works on every AERA app on this phone.</p><div class="row"><button class="go">Turn on '+LBL+'</button><button class="no">Not now</button></div><div class="aerapk-msg" style="text-align:left"></div></div>';
 document.body.appendChild(d);
 d.querySelector('.no').onclick=function(){ls('aera.pk.skip.'+uid,String(Date.now()+30*864e5));d.remove()};
 d.querySelector('.go').onclick=function(){enable(d,uid)};
 }finally{offering=false}}
async function enable(d,uid){var m=d.querySelector('.aerapk-msg'),g=d.querySelector('.go');g.disabled=true;m.textContent='';
 try{var s=sess();if(!s)throw new Error('signin');if(!RO)RO=await call('reg-options',{},s.access_token);var o=RO,p=o.options;RO=null;
  var c=await navigator.credentials.create({publicKey:{challenge:u2b(p.challenge),rp:p.rp,user:{id:u2b(p.user.id),name:p.user.name,displayName:p.user.displayName},
   pubKeyCredParams:p.pubKeyCredParams,timeout:p.timeout,attestation:p.attestation,authenticatorSelection:p.authenticatorSelection,
   excludeCredentials:(p.excludeCredentials||[]).map(function(x){return{type:'public-key',id:u2b(x.id),transports:x.transports}})}});
  var resp={id:c.id,rawId:b2u(c.rawId),type:c.type,clientExtensionResults:c.getClientExtensionResults?c.getClientExtensionResults():{},authenticatorAttachment:c.authenticatorAttachment||undefined,
   response:{clientDataJSON:b2u(c.response.clientDataJSON),attestationObject:b2u(c.response.attestationObject),transports:c.response.getTransports?c.response.getTransports():[]}};
  await call('reg-verify',{flowId:o.flowId,response:resp,device:navigator.userAgent},s.access_token);
  ls('aera.pk.u.'+uid,'1');ls('aera.pk.dev','1');m.className='aerapk-msg ok';m.textContent=LBL+' is on. Next time tap "Sign in with '+LBL+'".';g.style.display='none';d.querySelector('.no').textContent='Done';
 }catch(e){if(e&&e.name==='InvalidStateError'){ls('aera.pk.u.'+uid,'1');ls('aera.pk.dev','1');d.remove();return}
  m.className='aerapk-msg';m.textContent=(e&&e.name==='NotAllowedError')?'Cancelled.':'Could not turn on '+LBL+'. Try again later.';g.disabled=false}}

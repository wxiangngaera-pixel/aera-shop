<script data-field-replace>
(function(){
  var params=new URLSearchParams(window.location.search);
  var fields={};
  var paramMap={
    'first_name':'firstName','last_name':'lastName','full_name':'fullName',
    'email':'email','phone':'phone','company':'company',
    'city':'city','state':'state','country':'country'
  };
  var skipTags={'SCRIPT':1,'STYLE':1,'NOSCRIPT':1,'TEXTAREA':1,'CODE':1,'PRE':1};
  var hasUrlFields=false;
  for(var p in paramMap){
    var v=params.get(p);
    if(v){fields[paramMap[p]]=v;hasUrlFields=true;}
  }
  var contactId=params.get('contact_id');
  function esc(s){
    if(!s)return s;
    var d=document.createElement('div');
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
  }
  function doReplace(data){
    var r={};
    r['{{full_name}}']=esc(((data.firstName||'')+' '+(data.lastName||'')).trim()||((data.fullName||data.name)||''));
    r['{{first_name}}']=esc(data.firstName||(data.name?data.name.split(' ')[0]:'')||'');
    r['{{last_name}}']=esc(data.lastName||(data.name&&data.name.indexOf(' ')>-1?data.name.substring(data.name.indexOf(' ')+1):'')||'');
    r['{{email}}']=esc(data.email||'');
    r['{{phone}}']=esc(data.phone||'');
    r['{{company}}']=esc(data.company||'');
    r['{{city}}']=esc(data.city||'');
    r['{{state}}']=esc(data.state||'');
    r['{{country}}']=esc(data.country||'');
    r['{{date}}']=new Date().toLocaleDateString();
    r['{{time}}']=new Date().toLocaleTimeString();
    r['{{location}}']=[data.city,data.state,data.country].filter(Boolean).join(', ');
    r['{{tracking_id}}']=esc(data.trackingId||'');
    r['{{lastClickedProduct}}']=esc(data.lastClickedProduct||'');
    r['{{lastProductClickDate}}']=esc(data.lastProductClickDate||'');
    r['{{lastClickedProductPrice}}']=esc(data.lastClickedProductPrice||'');
    r['{{lastClickedProductURL}}']=esc(data.lastClickedProductURL||'');
    r['{{productsClickedCount}}']=esc(data.productsClickedCount||'0');
    r['{{ip_address}}']=esc(data.ipAddress||'');
    r['{{ip}}']=esc(data.ipAddress||'');
    if(data.customFields){
      for(var k in data.customFields){
        r['{{'+k+'}}']=esc(String(data.customFields[k]||''));
      }
    }
    params.forEach(function(v,k){
      if(!paramMap[k]&&k!=='contact_id'&&k!=='page_id'&&k.indexOf('utm_')!==0){
        r['{{'+k+'}}']=esc(v);
      }
    });
    var hasValues=false;
    for(var key in r){if(r[key]){hasValues=true;break;}}
    if(!hasValues)return;
    var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{
      acceptNode:function(n){
        var p=n.parentNode;
        if(p&&skipTags[p.nodeName])return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var node;
    while(node=walker.nextNode()){
      var txt=node.nodeValue;
      if(txt&&txt.indexOf('{{')>-1){
        var changed=txt;
        for(var ph in r){
          if(r[ph]&&changed.indexOf(ph)>-1){
            changed=changed.split(ph).join(r[ph]);
          }
        }
        if(changed!==txt)node.nodeValue=changed;
      }
    }
    var attrs=['value','placeholder','content','alt','title'];
    attrs.forEach(function(attr){
      var els=document.querySelectorAll('['+attr+'*="{{"]');
      for(var i=0;i<els.length;i++){
        var tag=els[i].tagName;
        if(skipTags[tag])continue;
        var val=els[i].getAttribute(attr);
        if(val){
          var nv=val;
          for(var ph in r){
            if(r[ph]&&nv.indexOf(ph)>-1){
              nv=nv.split(ph).join(r[ph]);
            }
          }
          if(nv!==val)els[i].setAttribute(attr,nv);
        }
      }
    });
  }
  function run(){
    if(contactId){
      var xhr=new XMLHttpRequest();
      xhr.open('GET','https://my.chatbees.io/api/landing/context/'+encodeURIComponent(contactId)+'?page_id=7643');
      xhr.onload=function(){
        if(xhr.status===200){
          try{
            var resp=JSON.parse(xhr.responseText);
            if(resp.success&&resp.contact){
              var merged=resp.contact;
              for(var k in fields){merged[k]=fields[k];}
              doReplace(merged);
              return;
            }
          }catch(e){}
        }
        if(hasUrlFields)doReplace(fields);
      };
      xhr.onerror=function(){if(hasUrlFields)doReplace(fields);};
      xhr.send();
    }else if(hasUrlFields){
      doReplace(fields);
    }
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',run);}
  else{run();}
})();
</script>

/* The console was written for Claude's runtime ( claude.use('db' | 'mcp' | 'downloads' | 'sample') ).

function KC_SHIM(URL_,ANON_,KEY_){
 var sb=supabase.createClient(URL_,ANON_,{auth:{storageKey:KEY_,persistSession:true,autoRefreshToken:true}});
 window.__KC_SB=sb;window.__KC_STANDALONE=true;
 var EMAIL=window.__KC_EMAIL||'';
 function cl(v){return v==null?v:JSON.parse(JSON.stringify(v))}
 function E(e){var x=new Error((e&&(e.message||e.details))||String(e));x.code=e&&e.code;return x}
 function snapDoc(id,data){return{id:id,exists:data!=null,data:function(){return data==null?undefined:cl(data)}}}
 function snapColl(m){var docs=Object.keys(m).map(function(id){return snapDoc(id,m[id])});return{docs:docs,size:docs.length,empty:!docs.length,forEach:function(f){docs.forEach(f)}}}
 var C={}; /* coll -> {m:{id:data}, ls:[fn], ready:bool, loading:promise} */
 function cc(c){return C[c]||(C[c]={m:{},ls:[],dls:{},ready:false,loading:null,t:0})}
 async function fetchColl(c){var out={},from=0,N=500;
  for(;;){var r=await sb.from('kc_docs').select('id,data').eq('coll',c).order('id').range(from,from+N-1);
   if(r.error)throw E(r.error);(r.data||[]).forEach(function(x){out[x.id]=x.data});
   if(!r.data||r.data.length<N)break;from+=N}
  return out}
 function emit(c){var o=cc(c);if(o.t)return;o.t=setTimeout(function(){o.t=0;
  var s=snapColl(o.m);o.ls.slice().forEach(function(f){try{f(s)}catch(e){console.error(e)}});
  Object.keys(o.dls).forEach(function(id){(o.dls[id]||[]).slice().forEach(function(f){try{f(snapDoc(id,o.m[id]))}catch(e){console.error(e)}})})},30)}
 function local(c,id,data){var o=cc(c);if(!o.ready&&!o.ls.length&&!Object.keys(o.dls).length)return;if(data==null)delete o.m[id];else o.m[id]=data;emit(c)}
 async function load(c){var o=cc(c);if(o.ready)return o;if(!o.loading)o.loading=fetchColl(c).then(function(m){o.m=m;o.ready=true;o.loading=null;return o},function(e){o.loading=null;throw e});return o.loading}
 async function reloadAll(){Object.keys(C).forEach(function(c){var o=C[c];if(!o.ready)return;fetchColl(c).then(function(m){o.m=m;emit(c)}).catch(function(){})})}
 function split(path){var p=String(path).split('/');return{c:p.slice(0,-1).join('/'),id:p[p.length-1]}}
 function docRef(path){var q=split(path),c=q.c,id=q.id;
  return{id:id,path:String(path),
   get:async function(){var o=C[c];if(o&&o.ready)return snapDoc(id,o.m[id]==null?null:o.m[id]);
    var r=await sb.from('kc_docs').select('data').eq('coll',c).eq('id',id).maybeSingle();if(r.error)throw E(r.error);return snapDoc(id,r.data?r.data.data:null)},
   set:async function(d){var data=cl(d||{});var r=await sb.from('kc_docs').upsert({coll:c,id:id,data:data,updated_at:new Date().toISOString(),updated_by:EMAIL});if(r.error)throw E(r.error);local(c,id,data)},
   update:async function(d){var patch=cl(d||{});var r=await sb.rpc('kc_merge',{p_coll:c,p_id:id,p_patch:patch});if(r.error)throw E(r.error);
    var o=cc(c);local(c,id,Object.assign({},o.m[id]||{},patch))},
   delete:async function(){var r=await sb.from('kc_docs').delete().eq('coll',c).eq('id',id);if(r.error)throw E(r.error);local(c,id,null)},
   onSnapshot:function(f,ef){var o=cc(c);(o.dls[id]=o.dls[id]||[]).push(f);ensureRT();
    load(c).then(function(){f(snapDoc(id,o.m[id]))},function(e){ef&&ef(e)});
    return function(){o.dls[id]=(o.dls[id]||[]).filter(function(x){return x!==f})}}}}
 function collRef(c){return{id:c,path:c,
   doc:function(id){return docRef(c+'/'+(id||('x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7))))},
   add:async function(d){var r=this.doc();await r.set(d);return r},
   get:async function(){var o=C[c];if(o&&o.ready)return snapColl(o.m);return snapColl(await fetchColl(c))},
   onSnapshot:function(f,ef){var o=cc(c);o.ls.push(f);ensureRT();
    load(c).then(function(){f(snapColl(o.m))},function(e){ef&&ef(e)});

 /* realtime : one channel for every list; a missed stretch ( sleep, lost wifi ) is caught up by re-reading */
 var RT=null,rtDown=false,hidAt=0;
 function onRow(p){var row=p.new&&p.new.coll?p.new:p.old;if(!row||!row.coll)return;var o=C[row.coll];if(!o||!o.ready)return;
  if(p.eventType==='DELETE'){delete o.m[row.id];return emit(row.coll)}

  sb.from('kc_docs').select('data').eq('coll',row.coll).eq('id',row.id).maybeSingle().then(function(r){if(r.data){o.m[row.id]=r.data.data;emit(row.coll)}})}
 function ensureRT(){if(RT)return;RT=1;
  sb.auth.getSession().then(function(x){var s=x.data.session;if(s){try{sb.realtime.setAuth(s.access_token)}catch(e){}}
  RT=sb.channel('kc-docs').on('postgres_changes',{event:'*',schema:'public',table:'kc_docs'},onRow)
   .subscribe(function(st){if(st==='SUBSCRIBED'){if(rtDown){rtDown=false;reloadAll()}}
    else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){rtDown=true;var old=RT;RT=null;setTimeout(function(){try{sb.removeChannel(old)}catch(e){}ensureRT()},3000)}})})}
 document.addEventListener('visibilitychange',function(){if(document.hidden){hidAt=Date.now()}else if(hidAt&&Date.now()-hidAt>30000){hidAt=0;reloadAll()}});
 sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT'){location.reload()}});
 var DB={doc:docRef,collection:collRef};
 var MCP={callTool:async function(server,name,args){
   var s=(await sb.auth.getSession()).data.session;if(!s)throw new Error('Please sign in again.');
   var r=await fetch(URL_+'/functions/v1/kc-mcp',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token,apikey:ANON_},body:JSON.stringify({name:name,args:args||{}})});
   var j=await r.json().catch(function(){return{}});
   if(!r.ok||j.error)throw new Error(j.error||('Chatbees link error '+r.status));
   var res=j.result||{},txt=(res.content||[]).filter(function(x){return x&&x.type==='text'}).map(function(x){return x.text}).join('\n');

   var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=(o&&o.filename)||'download';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},60000);return true}};
 window.claude={use:function(k){
   if(k==='db')return Promise.resolve(DB);

 var j={};try{j=await r.json()}catch(e){}if(!j.ok)throw new Error(j.error||('HTTP '+r.status));return j}
var platform=PKC.isUserVerifyingPlatformAuthenticatorAvailable?PKC.isUserVerifyingPlatformAuthenticatorAvailable().catch(function(){return false}):Promise.resolve(false);
var css=document.getElementById('aerapk-css')||document.createElement('style');css.id='aerapk-css';css.textContent='.aerapk-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;padding:12px;border-radius:12px;border:2px solid #16479E;background:#fff;color:#16479E;font:700 15px/1.2 inherit;font-family:inherit;cursor:pointer}.aerapk-btn svg{width:20px;height:20px}.aerapk-btn[disabled]{opacity:.6}.aerapk-msg{font-size:13px;margin-top:8px;text-align:center;color:#b42318}.aerapk-msg.ok{color:#16479E}#aerapkCard{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:2147483000;max-width:420px;margin:0 auto;background:#fff;color:#14213d;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.25);padding:16px;font-family:inherit;display:flex;gap:12px;align-items:flex-start}#aerapkCard .ic{flex:none;width:44px;height:44px;border-radius:12px;background:#16479E;display:flex;align-items:center;justify-content:center}#aerapkCard .ic svg{width:26px;height:26px}#aerapkCard b{display:block;font-size:15px;margin-bottom:2px}#aerapkCard p{margin:0 0 10px;font-size:13px;color:#555}#aerapkCard .row{display:flex;gap:8px}#aerapkCard button{border:0;border-radius:10px;padding:9px 14px;font:700 14px/1 inherit;font-family:inherit;cursor:pointer}#aerapkCard .go{background:#16479E;color:#FDB913}#aerapkCard .no{background:#eef1f7;color:#16479E}';

/* ---- sign in with a passkey ---- */
var AO=null,AOt=0,DEAD=false,TRIED={};
async function authOpts(){if(AO&&Date.now()-AOt<240000)return AO;AO=await call('auth-options');AOt=Date.now();return AO}
async function login(btn,msg){
 msg.className='aerapk-msg';msg.textContent='';btn.disabled=true;
 try{var o=await authOpts();AO=null;var p=o.options;
  var a=await navigator.credentials.get({publicKey:{challenge:u2b(p.challenge),rpId:p.rpId,timeout:p.timeout,userVerification:p.userVerification,allowCredentials:[]}});
  var resp={id:a.id,rawId:b2u(a.rawId),type:a.type,clientExtensionResults:a.getClientExtensionResults?a.getClientExtensionResults():{},authenticatorAttachment:a.authenticatorAttachment||undefined,
   response:{clientDataJSON:b2u(a.response.clientDataJSON),authenticatorData:b2u(a.response.authenticatorData),signature:b2u(a.response.signature),userHandle:a.response.userHandle?b2u(a.response.userHandle):undefined}};
  var v=await call('auth-verify',{flowId:o.flowId,response:resp});
  msg.className='aerapk-msg ok';msg.textContent='Signing you in…';
  try{C.before&&C.before()}catch(e){}
  var r=await SB().auth.verifyOtp({token_hash:v.token_hash,type:'email'});if(r.error)throw r.error;
  var uid=r.data&&r.data.user&&r.data.user.id;if(uid)ls('aera.pk.u.'+uid,'1');
  try{C.after&&C.after()}catch(e){}
 }catch(e){try{C.fail&&C.fail()}catch(_){}
  var m=String(e&&e.message||e);
  msg.textContent=(e&&e.name==='NotAllowedError')?'Cancelled. Try again, or use your password.':
   /unknown_passkey/.test(m)?LBL+' is not set up for this account yet. Sign in with your password once, then tap "Turn on '+LBL+'".':
   /expired/.test(m)?'That took too long. Try again.':'Could not sign in with '+LBL+'. Use your password.';
 }btn.disabled=false;authOpts().catch(function(){})}
function mountLogin(){if(!C.btn||DEAD)return;var t=document.querySelector(C.btn);if(!t||t.nextElementSibling&&t.nextElementSibling.classList.contains('aerapk-btn'))return;

 authOpts().catch(function(){DEAD=true;b.remove();m.remove()})}

/* ---- offer to turn it on after a normal sign-in ---- */
var RO=null,offering=false;

 d.innerHTML='<div class="ic" style="color:#FDB913">'+FACE+'</div><div><b>Sign in with '+LBL+'</b><p>Skip the email and password next time. Works on every AERA app on this phone.</p><div class="row"><button class="go">Turn on '+LBL+'</button><button class="no">Not now</button></div><div class="aerapk-msg" style="text-align:left"></div></div>';
 document.body.appendChild(d);

 }finally{offering=false}}
async function enable(d,uid){var m=d.querySelector('.aerapk-msg'),g=d.querySelector('.go');g.disabled=true;m.textContent='';
 try{var sb=SB(),s=(await sb.auth.getSession()).data.session;if(!RO)RO=await call('reg-options',{},s.access_token);var o=RO,p=o.options;RO=null;
  var c=await navigator.credentials.create({publicKey:{challenge:u2b(p.challenge),rp:p.rp,user:{id:u2b(p.user.id),name:p.user.name,displayName:p.user.displayName},
   pubKeyCredParams:p.pubKeyCredParams,timeout:p.timeout,attestation:p.attestation,authenticatorSelection:p.authenticatorSelection,
   excludeCredentials:(p.excludeCredentials||[]).map(function(x){return{type:'public-key',id:u2b(x.id),transports:x.transports}})}});
  var resp={id:c.id,rawId:b2u(c.rawId),type:c.type,clientExtensionResults:c.getClientExtensionResults?c.getClientExtensionResults():{},authenticatorAttachment:c.authenticatorAttachment||undefined,
   response:{clientDataJSON:b2u(c.response.clientDataJSON),attestationObject:b2u(c.response.attestationObject),transports:c.response.getTransports?c.response.getTransports():[]}};
  await call('reg-verify',{flowId:o.flowId,response:resp,device:navigator.userAgent},s.access_token);
  ls('aera.pk.u.'+uid,'1');m.className='aerapk-msg ok';m.textContent=LBL+' is on. Next time tap "Sign in with '+LBL+'".';g.style.display='none';d.querySelector('.no').textContent='Done';
 }catch(e){if(e&&e.name==='InvalidStateError'){ls('aera.pk.u.'+uid,'1');d.remove();return}
  m.className='aerapk-msg';m.textContent=(e&&e.name==='NotAllowedError')?'Cancelled.':'Could not turn on '+LBL+'. Try again later.';g.disabled=false}}
